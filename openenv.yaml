---
name: code-review-env
version: "1.0.0"
description: "A reinforcement learning environment where an AI agent acts as a 
  senior Python code reviewer. Each episode presents a flawed Python function. 
  The agent must identify the flaw type, explain it in plain English, and submit 
  a corrected version. Graded programmatically by executing both original and 
  fixed code against hidden test cases."
author: "Adithkp03"

entry_point: app.py
inference: inference.py

observation_space:
  type: text
  description: "Flawed Python function + task description + flaw type category"

action_space:
  type: text
  description: "JSON: flaw_type_guess, explanation (free text), fixed_code (complete function), request_hint (bool)"

reward_range: [0.01, 0.99]

tasks:
  - id: easy_bug_fix
    name: easy_bug_fix
    difficulty: easy
    description: "Fix a simple off-by-one or operator bug in a Python function"
    grader: grader.grade_fixed_code
    reward_range: [0.01, 0.99]
    problems: [off_by_one_loop, wrong_operator, missing_return]

  - id: easy_mutable_default
    name: easy_mutable_default
    difficulty: easy
    description: "Identify and fix the classic mutable default argument Python gotcha"
    grader: grader.grade_fixed_code
    reward_range: [0.01, 0.99]
    problems: [mutable_default_arg, integer_division, reversed_condition]

  - id: easy_loop_bug
    name: easy_loop_bug
    difficulty: easy
    description: "Fix infinite loop risk and division precision bugs"
    grader: grader.grade_fixed_code
    reward_range: [0.01, 0.99]
    problems: [infinite_loop_risk]

  - id: medium_inefficiency_lookup
    name: medium_inefficiency_lookup
    difficulty: medium
    description: "Optimize O(n^2) nested loop lookup to O(1) using a set or dict"
    grader: grader.grade_fixed_code
    reward_range: [0.01, 0.99]
    problems: [nested_loop_search, repeated_computation]

  - id: medium_inefficiency_string
    name: medium_inefficiency_string
    difficulty: medium
    description: "Fix string concatenation in loop and redundant sort inefficiencies"
    grader: grader.grade_fixed_code
    reward_range: [0.01, 0.99]
    problems: [string_concatenation, redundant_sort, unnecessary_list_copy]

  - id: hard_security_injection
    name: hard_security_injection
    difficulty: hard
    description: "Identify and fix SQL injection and hardcoded secrets vulnerabilities"
    grader: grader.grade_fixed_code
    reward_range: [0.01, 0.99]
    problems: [sql_injection, hardcoded_secret]

  - id: hard_security_execution
    name: hard_security_execution
    difficulty: hard
    description: "Fix eval() usage on untrusted input and path traversal vulnerabilities"
    grader: grader.grade_fixed_code
    reward_range: [0.01, 0.99]
    problems: [eval_usage, path_traversal]

  - id: hard_style_decomposition
    name: hard_style_decomposition
    difficulty: hard
    description: "Decompose god functions, replace magic numbers, improve naming and error handling"
    grader: grader.grade_fixed_code
    reward_range: [0.01, 0.99]
    problems: [god_function, magic_numbers, poor_naming, no_error_handling]

tags:
  - code-review
  - reinforcement-learning
  - python
  - llm-training
  - bug-detection
  - security
  - real-world
